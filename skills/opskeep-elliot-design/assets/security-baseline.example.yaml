schema_version: "2.3"
baseline_version: "1.0.0"
record_digest: null
project:
  id: "PRJ-PORTFOLIO-001"
  name: "Acme Studio Site"
  purpose: "Public brochure site with a contact form"
  owner: "site-owner"
  intake:
    constraint:
      statement: "Prospective clients cannot reach the studio outside business hours, so enquiries are lost"
      evidence: "Phone and email enquiries cluster after 18:00 and go unanswered until the next day"
    forces:
      push: "Missed enquiries; the current site has no way to ask for a quote"
      pull: "A short form that confirms receipt immediately"
      anxiety: "Visitors worry their details are shared or spammed"
      habit: "Prospects currently message on social media"
    existing_assets: ["Hosting platform with managed TLS", "Existing domain and email"]
    bet:
      belief: "visitors will use a short form if it states what happens to their details"
      wager: "two days of build effort and no recurring cost"
      expected_outcome: "more qualified enquiries received per month"
      leading_indicator: "form completion rate and time to first reply"
    outcomes: ["Enquiries outside business hours are captured and acknowledged", "No visitor data is exposed or sold"]
    rejected_options:
      - {option: "Live chat widget", reason: "Adds a third-party script and data processor for a low-volume site"}
  regulatory_context:
    - regime: "Data protection law of the visitor and operator jurisdictions (contact form collects names and email addresses)"
      status: "NOT_ASSESSED"
      notes: "Confirm which regime applies and whether registration or a privacy notice is required before launch"
risk:
  tier: "LOW"
  mode: "FAST_TRACK"
  rationale:
    - "Public content and a limited contact form"
    - "No accounts, payments, or privileged user workflows"
  likely_production_tier: "LOW"
  assurance:
    asvs_level: "L1"
    slsa_build_level: 1
    slsa_source_level: 1
lifecycle:
  status: "REVIEW_REQUIRED"
  production_posture: "ELIGIBLE_WHEN_APPROVED"
  spike_expires_at: null
  development_lock: "LOCKED"
  deployment_lock: "LOCKED"
classification_levels: [PUBLIC, INTERNAL, CONFIDENTIAL, SENSITIVE, RESTRICTED]
assets:
  - id: "AST-001"
    name: "Contact submissions"
    classification: "CONFIDENTIAL"
    owner: "site-owner"
    retention: "30 days"
  - id: "AST-002"
    name: "Deployment credentials"
    classification: "RESTRICTED"
    owner: "developer"
    retention: "Short-lived OIDC tokens only; no stored secret"
components:
  - id: "CMP-001"
    name: "Static web frontend"
    exposure: "INTERNET"
    provider: "example-host"
  - id: "CMP-002"
    name: "Contact form handler"
    exposure: "INTERNET"
    provider: "example-functions"
  - id: "CMP-003"
    name: "CI/CD pipeline"
    exposure: "THIRD_PARTY"
    provider: "example-ci"
trust_boundaries:
  - id: "TB-001"
    name: "Internet to application"
    from: "PUBLIC_INTERNET"
    to: ["CMP-001", "CMP-002"]
  - id: "TB-002"
    name: "CI to hosting provider"
    from: "CMP-003"
    to: ["CMP-001", "CMP-002"]
data_flows:
  - id: "FLW-001"
    name: "Submit contact message"
    origin: "Website visitor"
    processing: "Validate, rate-limit, and forward"
    destination: "Site owner inbox"
    classification: "CONFIDENTIAL"
    retention: "30 days"
    boundaries: ["TB-001"]
identities:
  - id: "ID-001"
    name: "Deployment workflow"
    type: "WORKLOAD"
    authentication: "OIDC federation"
    resources: ["CMP-001", "CMP-002"]
    permissions: ["deploy reviewed build"]
    forbidden_actions: ["read contact submissions", "manage organization billing"]
    human_approval: "production environment approval"
threats:
  - id: "THR-001"
    component_ids: ["CMP-002"]
    scenario: "Automated form abuse causes spam or service exhaustion"
    likelihood: "MEDIUM"
    impact: "LOW"
    control_ids: ["CTL-API-001", "CTL-INP-001"]
    refs: ["OWASP-T10-2025:A05"]
    residual_risk: "LOW"
    owner: "site-owner"
    status: "OPEN"
  - id: "THR-002"
    component_ids: ["CMP-001", "CMP-003"]
    scenario: "A committed secret or vulnerable dependency ships to production"
    likelihood: "MEDIUM"
    impact: "MEDIUM"
    control_ids: ["CTL-SC-001", "CTL-SEC-001"]
    refs: ["OWASP-T10-2025:A03"]
    residual_risk: "LOW"
    owner: "developer"
    status: "OPEN"
  - id: "THR-003"
    component_ids: ["CMP-003"]
    scenario: "Implementation or deployment proceeds from an unreviewed design"
    likelihood: "MEDIUM"
    impact: "MEDIUM"
    control_ids: ["CTL-GOV-001"]
    refs: ["OWASP-T10-2025:A06"]
    residual_risk: "LOW"
    owner: "site-owner"
    status: "OPEN"
  - id: "THR-004"
    component_ids: ["CMP-001", "CMP-002"]
    scenario: "Insecure hosting defaults or missing security headers enable script injection or data exposure"
    likelihood: "MEDIUM"
    impact: "LOW"
    control_ids: ["CTL-CFG-001"]
    refs: ["OWASP-T10-2025:A02"]
    residual_risk: "LOW"
    owner: "developer"
    status: "OPEN"
  - id: "THR-005"
    component_ids: ["CMP-002"]
    scenario: "Logs leak contact details, or abuse and failures go unnoticed"
    likelihood: "MEDIUM"
    impact: "LOW"
    control_ids: ["CTL-LOG-001"]
    refs: ["OWASP-T10-2025:A09"]
    residual_risk: "LOW"
    owner: "developer"
    status: "OPEN"
controls:
  - id: "CTL-GOV-001"
    domain: "GOVERNANCE"
    requirement: "No repository, implementation, or deployment until the owner explicitly approves this baseline version"
    status: "PLANNED"
    owner: "site-owner"
    acceptance: "CI rejects a change when the baseline is not APPROVED with a matching digest from a protected source"
    refs: ["SSDF-1.1:PO.1", "SSDF-1.1:PW.2"]
    evidence_ids: []
  - id: "CTL-API-001"
    domain: "API"
    requirement: "Rate-limit contact submissions and reject oversized or malformed requests"
    status: "PLANNED"
    owner: "developer"
    acceptance: "An abuse test demonstrates throttling and oversized requests are rejected"
    refs: ["ASVS-5.0:V4"]
    evidence_ids: []
  - id: "CTL-SC-001"
    domain: "SUPPLY_CHAIN"
    requirement: "Block committed secrets and high-severity dependency findings; commit the lockfile"
    status: "PLANNED"
    owner: "developer"
    acceptance: "Protected checks fail on a seeded secret and a vulnerable test dependency"
    refs: ["OWASP-T10-2025:A03", "SLSA-1.2:BUILD-L1"]
    evidence_ids: []
  - id: "CTL-INP-001"
    domain: "INPUT"
    requirement: "Validate every contact field server-side and encode all output; no raw HTML or header injection from form values"
    status: "PLANNED"
    owner: "developer"
    acceptance: "Injection and header-splitting test strings are rejected or neutralised"
    refs: ["ASVS-5.0:V1"]
    evidence_ids: []
  - id: "CTL-SEC-001"
    domain: "SECRETS"
    requirement: "No stored deployment secrets; CI uses short-lived federated tokens; no secrets in the repository, client bundle, or logs"
    status: "PLANNED"
    owner: "developer"
    acceptance: "Secret scan passes and the deployment identity holds no long-lived credential"
    refs: ["OWASP-T10-2025:A02"]
    evidence_ids: []
  - id: "CTL-CFG-001"
    domain: "CONFIG"
    requirement: "Ship secure defaults: HTTPS only, security headers (CSP, frame, content-type), no debug output, no directory listing"
    status: "PLANNED"
    owner: "developer"
    acceptance: "A header and TLS check against the deployed preview passes"
    refs: ["SSDF-1.1:PW.9", "CISA-SBD:SECURE-DEFAULTS"]
    evidence_ids: []
  - id: "CTL-LOG-001"
    domain: "LOGGING"
    requirement: "Log submission outcomes and abuse signals without storing message bodies or addresses; alert the owner on abnormal rates"
    status: "PLANNED"
    owner: "developer"
    acceptance: "Sample logs contain no contact details and an alert fires on a synthetic spike"
    refs: ["OWASP-T10-2025:A09"]
    evidence_ids: []
  - id: "CTL-DEP-001"
    domain: "DEPLOY"
    requirement: "Production deploys come only from the protected branch through an environment that requires owner approval, with one-step rollback"
    status: "PLANNED"
    owner: "site-owner"
    acceptance: "A deploy from an unapproved branch is denied and a rollback is rehearsed"
    refs: ["SSDF-1.1:PS.1"]
    evidence_ids: []
gates:
  - id: "GATE-001"
    name: "Baseline approval gate"
    stage: "PRE_IMPLEMENTATION"
    blocking: true
    control_ids: ["CTL-GOV-001"]
    required_evidence: ["EVD-001"]
    status: "NOT_YET_BUILT"
    evidence_ids: []
  - id: "GATE-002"
    name: "Security checks"
    stage: "PULL_REQUEST"
    blocking: true
    control_ids: ["CTL-SC-001", "CTL-API-001"]
    required_evidence: ["EVD-002"]
    status: "NOT_YET_BUILT"
    evidence_ids: []
  - id: "GATE-003"
    name: "Production deploy gate"
    stage: "PRE_DEPLOY"
    blocking: true
    control_ids: ["CTL-DEP-001"]
    required_evidence: ["EVD-003"]
    status: "NOT_YET_BUILT"
    evidence_ids: []
decisions:
  - id: "DEC-001"
    question: "Which approved mail service and retention configuration will receive messages?"
    owner: "site-owner"
    required_decision: "Provider and deletion mechanism"
    blocks_approval: true
    status: "OPEN"
evidence:
  - id: "EVD-001"
    type: "OWNER_APPROVAL"
    status: "NOT_YET_BUILT"
    observed_at: null
    observer: null
    location: null
  - id: "EVD-002"
    type: "CI_RUN"
    status: "NOT_YET_BUILT"
    observed_at: null
    observer: null
    location: null
  - id: "EVD-003"
    type: "CI_RUN"
    status: "NOT_YET_BUILT"
    observed_at: null
    observer: null
    location: null
monitoring:
  handoff:
    provider: "NONE"
    owner: "site-owner"
    configuration_status: "NOT_CONFIGURED"
    baseline_version: "1.0.0"
    record_digest: null
    environments: ["production"]
    handed_off_at: null
    acknowledged_at: null
  signals:
    - id: "MON-001"
      name: "Contact handler error rate"
      source: "function logs"
      severity: "MEDIUM"
      threshold: "Error rate above 5% for 10 minutes"
      route: "site-owner"
      runbook: "SECURITY.md#contact-handler"
      status: "PLANNED"
recovery:
  owner: "site-owner"
  backup: {status: "NOT_APPLICABLE", reason: "Site source is versioned; submissions are transient", details: ""}
  restore: {status: "PLANNED", details: "Redeploy last known-good immutable build"}
  rollback: {status: "PLANNED", details: "Hosting provider rollback to prior deployment"}
  incident_response: {status: "PLANNED", details: "Disable form endpoint, revoke deployment identity, preserve logs"}
supply_chain:
  sbom:
    required: false
    format: "NONE"
    status: "NOT_APPLICABLE"
    reason: "Static site with a small, locked dependency set; the lockfile and dependency scan are the inventory"
  provenance:
    status: "PLANNED"
    details: "Build runs on the hosted CI platform and records build provenance for each release"
  dependency_policy:
    lockfile_required: true
    update_automation: "Weekly automated dependency update pull requests"
    vulnerability_gate_severity: "HIGH"
  vulnerability_management:
    status: "PLANNED"
    remediation_sla_days: 30
    disclosure: "security contact address published on the site"
    support_policy: "Site is maintained under the studio support agreement"
    details: ""
capabilities:
  handles_files: false
  uses_self_contained_tokens: false
  uses_federated_login: false
source:
  repository: "git host: studio/brochure-site (private)"
  protected_branch: true
  history_protected: true
  required_checks: []
  review_policy: "ONE_REVIEWER"
engineering:
  secure_coding: {status: "PLANNED", practice: "Framework defaults for output encoding; lint rules for unsafe HTML sinks"}
  security_testing: {status: "PLANNED", practice: "Dependency scan and a form abuse-case test in CI"}
approval:
  decision: "PENDING"
  approver: null
  approved_at: null
  baseline_version: null
  record_digest: null
  scope: ["development", "production"]
  expires_at: null
changes: []
