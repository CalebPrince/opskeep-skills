  incident_response: {status: "UNRESOLVED", blocks_approval: false, details: ""}
supply_chain:
  sbom: {required: false, format: "NONE", status: "REQUIRED", reason: ""}
  provenance: {status: "REQUIRED", details: ""}
  dependency_policy: {lockfile_required: true, update_automation: "", vulnerability_gate_severity: "HIGH"}
  vulnerability_management:
    status: "REQUIRED"
    remediation_sla_days: null
    disclosure: ""        # how someone reports a vulnerability (contact or policy URL)
    support_policy: ""    # how long fixes and updates are provided
    monitoring_sources: ""  # MEDIUM+: how new vulnerabilities are found (scanners, advisories, reports)
    triage_method: ""       # MEDIUM+: how findings are prioritised
    root_cause_practice: "" # HIGH+: how root causes are analysed after a vulnerability or incident
    details: ""
capabilities:             # true switches on the matching practice (and, for files, the FILE control domain)
  handles_files: false
  uses_self_contained_tokens: false   # JWTs and similar -> engineering.token_validation
  uses_federated_login: false         # OAuth/OIDC sign-in -> engineering.federated_login
source:                   # SLSA Source track. Level 1 repository; 2 protected branch + history; 3 required checks; 4 two-party review
  repository: ""
  protected_branch: false
  history_protected: false
  required_checks: []
  review_policy: "NONE"   # NONE | ONE_REVIEWER | TWO_PARTY
engineering: {}           # practices, each {status, practice} or {status: NOT_APPLICABLE, reason}; keys per tier in references/engineering-practices.md
