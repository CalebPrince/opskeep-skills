schema_version: "2.3"
baseline_version: "0.1.0"
record_digest: null
project:
  id: "PRJ-001"
  name: ""
  purpose: ""
  owner: ""
  # Project gate. Answer these BEFORE designing controls: constraint first, then the bet.
  intake:
    constraint: {statement: "", evidence: ""}   # what is in the way of the business outcome (not what to build); evidence required at MEDIUM+
    forces: {push: "", pull: "", anxiety: "", habit: ""}   # MEDIUM+: forces on the people this serves; anxiety is where trust and security matter
    existing_assets: []                          # MEDIUM+: what already works or exists; use ["none"] if nothing. More, better, new, in that order
    bet: {belief: "", wager: "", expected_outcome: "", leading_indicator: ""}   # MEDIUM+: We believe ..., so we are betting ... that this produces ...
    outcomes: []                                 # MEDIUM+: outcomes (what changes), not activities (what gets built)
    rejected_options: []                         # MEDIUM+: [{option, reason}] paths considered and rejected
  # List every law, standard or contract that may apply (data protection, payments, sector rules).
  # status: APPLICABLE | NOT_APPLICABLE (needs notes) | NOT_ASSESSED. Required non-empty at MEDIUM+.
  regulatory_context: []
risk:
  tier: "LOW"
  mode: "FAST_TRACK"
  rationale: []
  likely_production_tier: null
  assurance:
    # Skill policy minimums by tier: ASVS LOW L1, MEDIUM L2, HIGH L2, CRITICAL L3; SLSA build LOW 1, MEDIUM 1, HIGH 2, CRITICAL 3.
    # A lower target needs deviation_reason. asvs_level NOT_APPLICABLE needs asvs_reason.
    asvs_level: "L1"
    slsa_build_level: 1
    slsa_source_level: 1   # 0-4; policy minimum LOW 1, MEDIUM 2, HIGH 3, CRITICAL 4 (skill policy, not SLSA text)
lifecycle:
  status: "DRAFT"
  production_posture: "ELIGIBLE_WHEN_APPROVED"
  spike_expires_at: null
  development_lock: "LOCKED"
  deployment_lock: "LOCKED"
classification_levels: [PUBLIC, INTERNAL, CONFIDENTIAL, SENSITIVE, RESTRICTED]
assets: []
components: []   # set ai_capability: true on any component that uses a model, agent or tool-calling
